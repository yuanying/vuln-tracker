# Publishing the vuln-tracker image
#
# The image is named after the git ref it was built from: a push to main
# publishes `main`, a v* tag publishes that tag. `latest` is not published.
# Every image carries org.opencontainers.image.source and .revision, which is
# what vuln-tracker itself reads from every image built here: `:main` and its
# revision tell it a fix is on main but not yet released.
#
# The tests run first and the image is pushed only when they pass. A push to
# main also deletes the versions it leaves untagged; tagged versions are never
# touched.
name: publish

# Push events only: a pull request from a fork raises none in this
# repository, so nothing a fork wrote reaches the job that can write packages.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# The later of two pushes to main should win the `main` tag. Cancelling is
# per ref, so a version tag is never cancelled by a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Widened here and not at the top, so the one job able to write a
    # package is the one that says so.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only linux/amd64: the cluster's workers are amd64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The token GitHub mints for this run; the permissions above are its
      # ceiling.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          # Without this the push carries a provenance attestation and a
          # single-platform image becomes an index.
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Say what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo "- built from: ${SERVER}/${REPO}/commit/${SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every push to main moves `main` onto a new image and leaves the previous
  # one untagged; nothing asks for those by digest. The action keeps the
  # platform manifests of tagged images, so it stays safe if a platform is
  # added. Pushes to main share one concurrency group, so two of these never
  # run against the package at once.
  cleanup:
    name: cleanup
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: vuln-tracker
          delete-untagged: true
          validate: true
