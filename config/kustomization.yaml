apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything vuln-tracker needs to run in a cluster where Trivy Operator
# already runs. The Secrets it reads are optional and not shipped here: an
# overlay (fleet-infra) supplies them. See README.md for what each one holds.
resources:
  - namespace.yaml
  - rbac
  - manager
