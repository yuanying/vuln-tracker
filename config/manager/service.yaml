# /metrics for Prometheus (config/prometheus has a ServiceMonitor for
# kube-prometheus) and the JSON API, for gated's Ingress (ADR 0015).
apiVersion: v1
kind: Service
metadata:
  name: vuln-tracker
  namespace: vuln-tracker
  labels:
    app.kubernetes.io/name: vuln-tracker
spec:
  selector:
    app.kubernetes.io/name: vuln-tracker
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
    - name: api
      port: 8082
      targetPort: api
      protocol: TCP
